name: Windows AMD RX 9070 XT Portable Build

on:
  workflow_dispatch:
    inputs:
      display_version:
        description: 'Display version label stamped on the build'
        required: false
        default: '2.1.9-amd-nr'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-amd-portable:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Qt 6.8.3 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'
          cache: true

      - name: Fetch public SDK headers (DLSS, NVOF, NVENC, AMD AMF, Intel XeSS, AMD FidelityFX 1.1.4 + 2.x)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps/nvof/NvOFInterface, deps/nvof/Common/NvOFBase | Out-Null
          git clone --depth 1 https://github.com/NVIDIA/DLSS.git deps/dlss
          git clone --depth 1 https://github.com/jp7677/dxvk-nvapi.git deps/dxvk-nvapi
          Copy-Item 'deps/dxvk-nvapi/inc/nvofapi/*.h' 'deps/nvof/NvOFInterface/'
          git clone --depth 1 --branch n13.0.19.0 https://github.com/FFmpeg/nv-codec-headers.git deps/nv-codec-headers
          git clone --depth 1 https://github.com/GPUOpen-LibrariesAndSDKs/AMF.git deps/amf
          git clone --depth 1 https://github.com/intel/xess.git deps/xess
          git clone --depth 1 https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git deps/fidelityfx2
          git clone --depth 1 --branch v1.1.4 https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git deps/fidelityfx1

      - name: Build AMD FidelityFX 1.1.4 Optical Flow static libraries (VEYRA_HAS_AMD_OF=1)
        shell: pwsh
        run: |
          cmake -S deps/fidelityfx1/sdk -B deps/fidelityfx1/sdk/build -G "Visual Studio 17 2022" -A x64 `
            -DFFX_API_BACKEND=DX12_X64 `
            -DFFX_API_DX12=ON `
            -DFFX_OF=ON `
            -DFFX_AUTO_COMPILE_SHADERS=ON
          cmake --build deps/fidelityfx1/sdk/build --config Release --target ffx_opticalflow_x64 ffx_backend_dx12_x64 --parallel 4
          if (-not (Test-Path 'deps/fidelityfx1/sdk/bin/ffx_sdk/ffx_opticalflow_x64.lib') -or -not (Test-Path 'deps/fidelityfx1/sdk/bin/ffx_sdk/ffx_backend_dx12_x64.lib')) {
            throw 'FidelityFX 1.1.4 opticalflow static libs were not produced!'
          }
          Get-Item 'deps/fidelityfx1/sdk/bin/ffx_sdk/*.lib' | Select-Object Name, Length

      - name: Download prebuilt FFmpeg 9.0 Windows x64 shared-dev SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps/ffmpeg-dl | Out-Null
          $zip = 'deps/ffmpeg-dl/ffmpeg-9.0.zip'
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath 'deps/ffmpeg-dl' -Force
          $extracted = Get-ChildItem -Path 'deps/ffmpeg-dl' -Directory | Select-Object -First 1
          Move-Item -Path $extracted.FullName -Destination 'deps/ffmpeg'
          New-Item -ItemType Directory -Force -Path 'deps/ffmpeg/share/ffmpeg' | Out-Null
          @'
          get_filename_component(_ffmpeg_root "${CMAKE_CURRENT_LIST_DIR}/../.." ABSOLUTE)
          set(FFMPEG_FOUND TRUE)
          set(FFMPEG_INCLUDE_DIRS "${_ffmpeg_root}/include")
          set(FFMPEG_LIBRARY_DIRS "${_ffmpeg_root}/lib")
          set(FFMPEG_LIBRARIES
            "${_ffmpeg_root}/lib/avformat.lib"
            "${_ffmpeg_root}/lib/avcodec.lib"
            "${_ffmpeg_root}/lib/avfilter.lib"
            "${_ffmpeg_root}/lib/swresample.lib"
            "${_ffmpeg_root}/lib/swscale.lib"
            "${_ffmpeg_root}/lib/avutil.lib"
          )
          '@ | Set-Content -Path 'deps/ffmpeg/share/ffmpeg/FindFFMPEG.cmake' -Encoding utf8

      - name: Configure Veyra (Windows 11 x64, AMD RX 9070 XT Multi-Backend)
        shell: pwsh
        run: |
          $ffmpegRoot = (Resolve-Path 'deps/ffmpeg').Path
          $dlssRoot = (Resolve-Path 'deps/dlss').Path
          $nvofRoot = (Resolve-Path 'deps/nvof').Path
          $nvencRoot = (Resolve-Path 'deps/nv-codec-headers').Path
          $amfRoot = (Resolve-Path 'deps/amf/amf/public').Path
          $xessRoot = (Resolve-Path 'deps/xess').Path
          $ffx1Root = (Resolve-Path 'deps/fidelityfx1/sdk').Path
          $ffx2Root = (Resolve-Path 'deps/fidelityfx2/Kits/FidelityFX').Path
          $label = if ('${{ github.event.inputs.display_version }}' -ne '') { '${{ github.event.inputs.display_version }}' } else { '2.1.9-amd-nr' }
          cmake -S . -B out/build -G "Visual Studio 17 2022" -A x64 `
            -DVEYRA_DISPLAY_VERSION="$label" `
            -DVEYRA_BUILD_QML_UI=ON `
            -DVEYRA_ENABLE_EXPERIMENTAL_DLSSNR=ON `
            -DVEYRA_DLSS_SDK_ROOT="$dlssRoot" `
            -DVEYRA_NVOF_SDK_ROOT="$nvofRoot" `
            -DVEYRA_NVENC_HEADERS_ROOT="$nvencRoot" `
            -DVEYRA_AMF_SDK_ROOT="$amfRoot" `
            -DVEYRA_XESS_ROOT="$xessRoot" `
            -DVEYRA_FIDELITYFX_ROOT="$ffx1Root" `
            -DVEYRA_FIDELITYFX2_ROOT="$ffx2Root" `
            -DVEYRA_FFMPEG_ROOT="$ffmpegRoot" `
            -DVEYRA_ENABLE_DEINTERLACE=ON `
            -DVEYRA_ENABLE_LIBDOVI=OFF `
            -DVEYRA_ENABLE_D3D12_DEBUG=OFF

      - name: Build veyra_qml_ui and shaders
        run: cmake --build out/build --config Release --target veyra_qml_ui veyra_amd_nr_test_worker --parallel 4

      - name: Stage portable AMD package
        shell: pwsh
        run: |
          $stage = 'out/Veyra-AMD-RX9070XT-win64-portable'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/shaders" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/runtime_local/amd-nr" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/runtime_local/amd-nr-mochizuki" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/runtime_local/amd-nr-rdna3" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/runtime_local/amd-nr-neuralhub" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/runtime_local/amd/fidelityfx" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/scripts/amd-nr" | Out-Null

          Copy-Item 'out/build/Release/veyra_qml_ui.exe' "$stage/"
          if (Test-Path 'out/build/shaders') {
            Copy-Item 'out/build/shaders/*.dxil' "$stage/shaders/" -ErrorAction SilentlyContinue
          }
          Copy-Item -Recurse 'qml' "$stage/qml"
          Copy-Item 'deps/ffmpeg/bin/*.dll' "$stage/" -ErrorAction SilentlyContinue
          if (Test-Path 'deps/fidelityfx2/Kits/FidelityFX/signedbin') {
            Copy-Item 'deps/fidelityfx2/Kits/FidelityFX/signedbin/*.dll' "$stage/runtime_local/amd/fidelityfx/" -ErrorAction SilentlyContinue
          }
          Copy-Item -Recurse 'i18n' "$stage/i18n"
          Copy-Item 'scripts/amd-nr/stage-mochizuki-runtime.py' "$stage/scripts/amd-nr/"
          Copy-Item 'scripts/amd-nr/stage-neuralhub-runtime.py' "$stage/scripts/amd-nr/"
          Copy-Item 'docs/AMD_RX9070XT_NR_BACKENDS.md' "$stage/"
          Copy-Item 'LICENSE' "$stage/"

          $windeployqt = Join-Path $env:QT_ROOT_DIR 'bin/windeployqt.exe'
          & $windeployqt --release --qmldir qml/Veyra "$stage/veyra_qml_ui.exe"

          Compress-Archive -Path "$stage/*" -DestinationPath 'out/Veyra-AMD-RX9070XT-win64-portable.zip' -Force

      - name: Upload portable AMD build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veyra-AMD-RX9070XT-win64-portable
          path: out/Veyra-AMD-RX9070XT-win64-portable.zip
          retention-days: 30
